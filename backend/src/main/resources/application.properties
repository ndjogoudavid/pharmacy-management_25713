spring.application.name=PharmacyManagement
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:pharmacydb}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# JWT
app.security.jwt.secret=${JWT_SECRET:ZnJhZ21lbnQtZGVmYXVsdC1zZWNyZXQtbWF5LWJlLXVwZGF0ZWQ=}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Mail (keep current credentials as defaults for local/dev)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}

# Frontend base for email links (falls back to Vite default port)
app.frontend.reset-url=${FRONTEND_RESET_URL:http://localhost:5173/reset-password}

# Log 2FA/reset codes to console (overridden to false in production profile)
app.auth.log-codes=${APP_LOG_CODES:false}

# Demo seed flag
app.seed.demo=${APP_SEED_DEMO:false}
app.seed.demo.password=${APP_SEED_DEMO_PASSWORD:Demo123!}

# Externalized secrets (optional local file, ignored in VCS)
spring.config.import=optional:file:./application-secrets.properties,optional:file:./backend/application-secrets.properties

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.tool.schema.internal=WARN
logging.level.rw.auca.ac.pharmacy=INFO

server.port=8080
server.address=0.0.0.0
